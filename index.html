<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bible - Personal Reading & Study</title>
    <meta name="description" content="A clean, modern, personal Bible web application for reading, meditating, and searching in English and Tamil." />
    <!-- Instant Theme Guard to eliminate white theme flash on startup -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('bible_app_preferences');
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs && prefs.theme) {
              document.documentElement.setAttribute('data-theme', prefs.theme);
              if (prefs.theme === 'custom' && prefs.customThemeColors) {
                var c = prefs.customThemeColors;
                document.documentElement.style.setProperty('--bg-primary', c.bgPrimary);
                document.documentElement.style.setProperty('--bg-secondary', c.bgSecondary);
                document.documentElement.style.setProperty('--bg-surface', c.bgSurface);
                document.documentElement.style.setProperty('--text-primary', c.textPrimary);
                document.documentElement.style.setProperty('--text-secondary', c.textSecondary);
                document.documentElement.style.setProperty('--accent-color', c.accentColor);
              }
            }
          }
        } catch(e) {}
      })();
    </script>
    <!-- Non-blocking Google Fonts (Offline-safe, avoids 30s hang) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600&display=swap">
    </noscript>
    <style>
      #initial-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .loader-logo-wrap {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 20px rgba(217, 119, 6, 0.25);
        margin-bottom: 1.5rem;
        animation: pulse-glow 2s ease-in-out infinite alternate;
      }
      .loader-logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      .loader-title {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 0.25rem 0;
        color: #f8fafc;
      }
      .loader-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin: 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        from { transform: scale(1); filter: brightness(1); }
        to { transform: scale(1.04); filter: brightness(1.08); }
      }
    </style>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-logo-wrap">
          <img src="/icon-192.png" alt="Bible Logo" />
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-title">வேதாகமம் தயாராகிறது...</p>
        <p class="loader-sub">Preparing Holy Bible...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
