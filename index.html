<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bible - Personal Reading & Study</title>
    <meta name="description" content="A clean, modern, personal Bible web application for reading, meditating, and searching in English and Tamil." />
    <!-- Google Fonts for Tamil & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;600;700&family=Arima:wght@400;600;700&family=Baloo+Thambi+2:wght@500;700;800&family=Catamaran:wght@400;600;700&family=Cinzel:wght@400;600;700&family=Coiny&family=Hind+Madurai:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Kavivanar&family=Libre+Baskerville:ital,wght@0,400;0,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700&family=Montserrat:wght@400;600;700&family=Mukta+Malar:wght@400;600;700&family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Noto+Serif+Tamil:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Outfit:wght@400;600&family=Pavanam&family=Playfair+Display:ital,wght@0,400;0,700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      #initial-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .loader-logo-wrap {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 20px rgba(217, 119, 6, 0.25);
        margin-bottom: 1.5rem;
        animation: pulse-glow 2s ease-in-out infinite alternate;
      }
      .loader-logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      .loader-title {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 0.25rem 0;
        color: #f8fafc;
      }
      .loader-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin: 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        from { transform: scale(1); filter: brightness(1); }
        to { transform: scale(1.04); filter: brightness(1.08); }
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #0f172a;">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-logo-wrap">
          <img src="/icon-192.png" alt="Bible Logo" />
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-title">வேதாகமம் தயாராகிறது...</p>
        <p class="loader-sub">Preparing Holy Bible...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
